<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2ec">
  <meta name="description" content="Thrive — track nutrition, hydration, activity, sleep and body metrics, with reminders and analytics.">
  <title>Thrive · Fitness &amp; Health Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-maskable-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/today" aria-label="Thrive home">
        <img src="icon.svg" alt="" width="34" height="34">
        <span>Thrive</span>
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Today</h1>
        <div class="top-actions">
        <div class="datenav" id="datenav">
          <button class="icon-btn" data-action="date-prev" aria-label="Previous day"></button>
          <label class="date-label">
            <span id="date-text">Today</span>
            <input type="date" id="date-input" aria-label="Pick a date">
          </label>
          <button class="icon-btn" data-action="date-next" aria-label="Next day"></button>
          <button class="btn sm ghost" data-action="date-today" id="date-today-btn">Today</button>
        </div>
          <button class="search-btn" data-action="cmdk" id="search-btn" aria-label="Search and commands"></button>
          <button class="icon-btn" data-action="toggle-theme" id="theme-btn" aria-label="Toggle theme"></button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="tip" role="tooltip"></div>

  <noscript>Thrive needs JavaScript enabled to run.</noscript>
  <script src="js/foods.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
